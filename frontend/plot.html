<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Personal Data - Plot</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="styles.css" />
	<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body data-view="detail">
	<div class="phone-stage" id="phoneStage">
		<div class="phone-shell">
			<main class="phone" aria-label="Plot screen">
				<header class="header plot-header" id="pageTitle">
					<button class="plot-back-btn" id="plotBackButton" type="button" aria-label="Back to insights overview" title="Back to insights overview">
						<svg viewBox="0 0 24 24" aria-hidden="true">
							<path d="M14.8 5.5L8.3 12l6.5 6.5" fill="none" stroke="#27636d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
						</svg>
					</button>
					<span class="plot-header-title">Performance Insights</span>
				</header>

				<section class="content plot-content">
					<div class="plot-app" id="plotApp" aria-live="polite"></div>
				</section>

				<nav class="bottom-nav" aria-label="Primary navigation">
					<svg class="icon profile" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="12" cy="8" r="3.7" />
						<path d="M4 19c1.9-2.8 4.8-4.2 8-4.2s6.1 1.4 8 4.2" />
						<circle cx="12" cy="12" r="10" />
					</svg>

					<svg class="record-icon" viewBox="0 0 36 36" aria-hidden="true">
						<circle cx="18" cy="18" r="15.2" fill="#ffffff" stroke="#27636d" stroke-width="3" />
						<circle cx="18" cy="18" r="9.2" fill="#27636d" stroke="none" />
					</svg>

					<svg class="icon home" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M3.2 10.2L12 3.3l8.8 6.9V21H3.2z" />
					</svg>

					<svg class="icon search" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="10.5" cy="10.5" r="7" />
						<line x1="16" y1="16" x2="21" y2="21" />
						<line x1="7.8" y1="11" x2="7.8" y2="13.5" />
						<line x1="10.5" y1="8" x2="10.5" y2="13.5" />
						<line x1="13.2" y1="9.8" x2="13.2" y2="13.5" />
					</svg>

					<svg class="icon folder" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M3 8h6.5l1.7 2H21v8.3A1.7 1.7 0 0 1 19.3 20H4.7A1.7 1.7 0 0 1 3 18.3z" />
					</svg>
				</nav>
			</main>
		</div>
	</div>
	<script src="insights-dashboard.js"></script>
</body>
</html>
