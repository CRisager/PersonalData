<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Personal Data - New Recording</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="frontend/styles.css" />
</head>
<body>
	<div class="phone-stage" id="phoneStage">
		<div class="phone-shell">
			<main class="phone" aria-label="New recording screen">
				<header class="header" id="pageTitle">New recording</header>

				<section class="steps" aria-label="Workflow steps">
					<div class="step active" id="stepRecord">Record</div>
					<div class="step" id="stepConfirm">Confirm</div>
					<div class="step" id="stepLearn">Learn</div>
				</section>

				<section class="content">
					<div class="idle-view" id="idleView">
						<p class="prompt">Start recording<br />when ready</p>
						<button class="play-button" id="startButton" aria-label="Start recording">
							<svg viewBox="0 0 24 24" aria-hidden="true">
								<rect x="9" y="4" width="6" height="11" rx="3" fill="#ffffff" stroke="none" />
								<path d="M7 12.5a5 5 0 0 0 10 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
								<line x1="12" y1="17.5" x2="12" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
								<line x1="9.5" y1="20" x2="14.5" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
							</svg>
						</button>
					</div>

					<div class="recording-view" id="recordingView" hidden>
						<p class="recording-title">Recording...</p>
						<div class="waveform-wrap">
							<canvas id="waveform" width="336" height="90" aria-label="Live audio waveform"></canvas>
						</div>
						<p class="timer" id="timerDisplay">00:00</p>
						<div class="recording-controls">
							<button class="control-btn" id="pauseButton" aria-label="Pause recording" title="Pause">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<rect x="6" y="4" width="4.2" height="16" rx="2" fill="#ffffff"></rect>
									<rect x="13.8" y="4" width="4.2" height="16" rx="2" fill="#ffffff"></rect>
								</svg>
							</button>
							<button class="control-btn" id="stopButton" aria-label="Stop recording" title="Stop">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<rect x="6" y="6" width="12" height="12" rx="2.3" fill="#ffffff"></rect>
								</svg>
							</button>
						</div>
					</div>

					<div class="confirm-view" id="confirmView" hidden>
						<p class="confirm-title">Save recording</p>

						<div class="playback-wrap">
							<button class="preview-play-btn" id="previewPlayButton" aria-label="Play preview" title="Play preview">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<path d="M8 5.5L18 12L8 18.5a2 2 0 0 1-3-1.7V7.2a2 2 0 0 1 3-1.7z" fill="#ffffff"></path>
								</svg>
							</button>
							<div class="preview-wave">
								<canvas id="previewWaveform" width="246" height="64" aria-label="Preview waveform"></canvas>
							</div>
							<p class="preview-time" id="previewTime">00:00</p>
							<audio id="audioPreview" aria-label="Recorded audio playback"></audio>
						</div>

						<div class="meta-wrap">
							<div class="name-row">
								<input
									id="recordingName"
									class="name-input"
									type="text"
									value="Recording_132"
									aria-label="Recording name"
								/>
								<button class="edit-name-btn" id="editNameButton" aria-label="Edit recording name" title="Edit name">
									<svg viewBox="0 0 24 24" aria-hidden="true">
										<path d="M4 20h4.2L19 9.2 14.8 5 4 15.8z" fill="none" stroke="#21afa2" stroke-width="2" stroke-linejoin="round"/>
										<path d="M12.8 7 17 11.2" fill="none" stroke="#21afa2" stroke-width="2" stroke-linecap="round"/>
									</svg>
								</button>
							</div>

							<label class="category-label" for="categorySelect">Category:</label>
							<select id="categorySelect" class="category-select" aria-label="Recording category">
								<option value="School presentation" selected>School presentation</option>
								<option value="Private use">Private use</option>
								<option value="Other">Other</option>
								<option value="Create new category">Create new category</option>
							</select>
						</div>

						<div class="confirm-actions">
							<button class="action-btn delete" id="deleteButton" aria-label="Discard recording" title="Discard">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<path d="M4.5 7.5h15" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
									<path d="M9 7.5V5.8h6v1.7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
									<path d="M7.3 7.5l1 11a1.8 1.8 0 0 0 1.8 1.5h4a1.8 1.8 0 0 0 1.8-1.5l1-11" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
							</button>
							<button class="action-btn save" id="saveButton" aria-label="Save recording" title="Save">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<path d="M5 12.5l5 5 9-10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
							</button>
						</div>
						<p class="save-status" id="saveStatus" aria-live="polite"></p>
					</div>

					<div class="learn-view" id="learnView" hidden>
						<div class="learn-progress" aria-label="Learning progress">
							<div class="learn-progress-dot active">1</div>
							<div class="learn-progress-dot">2</div>
							<div class="learn-progress-dot">3</div>
						</div>

						<div class="learn-heading-row">
							<h2 class="learn-heading">Filler words</h2>
							<span class="learn-info" aria-hidden="true">i</span>
						</div>
						<p class="learn-subtext" id="learnSummaryText"></p>

						<div class="learn-legend" aria-label="Chart legend">
							<div class="learn-legend-item"><span class="swatch filler"></span>Filler words for this session</div>
							<div class="learn-legend-item"><span class="swatch nonfiller"></span>Non-filler words</div>
							<div class="learn-legend-item"><span class="swatch previous"></span>Previous filler word average</div>
						</div>

						<div class="learn-chart-wrap" id="learnChartWrap" aria-label="Filler-word ratio chart">
							<div class="learn-donut" id="learnDonut" role="img" aria-label="Filler words ratio">
								<span class="learn-pct-label filler" id="learnFillerLabel"></span>
								<span class="learn-pct-label previous" id="learnPreviousLabel"></span>
							</div>
							<div class="learn-word-list" id="learnWordList"></div>
						</div>

						<p class="learn-message" id="learnMessage"></p>

						<div class="learn-actions">
							<button class="learn-next-btn" id="learnNextButton" aria-label="Next step" title="Next step">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<line x1="5" y1="12" x2="19" y2="12" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
									<path d="M13 6l6 6-6 6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
							</button>
						</div>
					</div>

					<div class="learn-view-step-2" id="learnViewStep2" hidden>
						<div class="learn-progress" aria-label="Learning progress">
							<div class="learn-progress-dot">1</div>
							<div class="learn-progress-dot active">2</div>
							<div class="learn-progress-dot">3</div>
						</div>

						<div class="learn-heading-row">
							<h2 class="learn-heading">Pace</h2>
							<span class="learn-info" aria-hidden="true">i</span>
						</div>
						<p class="learn-subtext" id="learnPaceSubtext"></p>

<div class="pace-legend-wrap" aria-label="Pace chart legend">
						<div class="pace-legend-item"><span class="pace-legend-swatch current"></span>Pace for this session</div>
						<div class="pace-legend-item"><span class="pace-legend-swatch recommended"></span>Recommended range</div>
						<div class="pace-legend-item"><span class="pace-legend-swatch previous"></span>Previous average pace</div>
					</div>

					<div class="pace-gauge-wrap" id="paceGaugeWrap" aria-label="Pace gauge">
						<div class="pace-gauge-container">
							<svg class="pace-gauge-svg" viewBox="0 -40 546 340" preserveAspectRatio="xMidYMid meet" aria-label="White half-circle base gauge">
								<!-- Radius: 273px. Thickness: 25% of radius = 68.25px. -->
								<path
									d="M 0 273 A 273 273 0 0 1 546 273 L 477.75 273 A 204.75 204.75 0 0 0 68.25 273 Z"
									fill="#FFF"
								/>
								<!-- Overlay annulus segment: 65deg to 115deg -->
								<path
									id="paceRecommendedRangeArc"
									d=""
									fill="#DFF0EE"
								/>
								<polygon
									id="paceCurrentTriangle"
									points="257 273 289 273 273 0"
									fill="#20AEA0"
								/>
								<circle cx="273" cy="273" r="16" fill="#20AEA0" />
								<line
									id="paceHistoricAverageLine"
									x1="0"
									y1="0"
									x2="0"
									y2="0"
									stroke="#7f7f7f"
									stroke-width="2"
									stroke-dasharray="5 4"
									stroke-linecap="round"
								/>
								<text id="paceBandLabelFast" class="pace-band-label">fast</text>
								<text id="paceBandLabel150" class="pace-band-label">150</text>
								<text id="paceBandLabel125" class="pace-band-label">125</text>
								<text id="paceBandLabel100" class="pace-band-label">100</text>
								<text id="paceBandLabelSlow" class="pace-band-label">slow</text>
							</svg>
						</div>
						<div class="pace-value-display">
							<div class="pace-value" id="paceValue">0</div>
							<div class="pace-value-label">words/min</div>
						</div>
						</div>
						<p class="pace-message" id="paceMessage"></p>

						<div class="learn-actions-dual" id="learnActionsDual">
							<button class="learn-nav-btn back" id="learnBackButton" aria-label="Previous step" title="Previous step">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<line x1="5" y1="12" x2="19" y2="12" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
									<path d="M11 6l-6 6 6 6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
							</button>
							<button class="learn-nav-btn forward" id="learnStep2NextButton" aria-label="Next step" title="Next step">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<line x1="5" y1="12" x2="19" y2="12" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
									<path d="M13 6l6 6-6 6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
							</button>
						</div>
					</div>
				</section>

				<nav class="bottom-nav" aria-label="Primary navigation">
					<svg class="icon profile" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="12" cy="8" r="3.7" />
						<path d="M4 19c1.9-2.8 4.8-4.2 8-4.2s6.1 1.4 8 4.2" />
						<circle cx="12" cy="12" r="10" />
					</svg>

					<svg class="record-icon" viewBox="0 0 36 36" aria-hidden="true">
						<circle cx="18" cy="18" r="15.2" fill="#ffffff" stroke="#ff0000" stroke-width="3" />
						<circle cx="18" cy="18" r="9.2" fill="#ff0000" stroke="none" />
					</svg>

					<svg class="icon home" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M3.2 10.2L12 3.3l8.8 6.9V21H3.2z" />
					</svg>

					<svg class="icon search" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="10.5" cy="10.5" r="7" />
						<line x1="16" y1="16" x2="21" y2="21" />
						<line x1="7.8" y1="11" x2="7.8" y2="13.5" />
						<line x1="10.5" y1="8" x2="10.5" y2="13.5" />
						<line x1="13.2" y1="9.8" x2="13.2" y2="13.5" />
					</svg>

					<svg class="icon folder" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M3 8h6.5l1.7 2H21v8.3A1.7 1.7 0 0 1 19.3 20H4.7A1.7 1.7 0 0 1 3 18.3z" />
					</svg>
				</nav>
			</main>
		</div>
	</div>
	<script src="frontend/app.js"></script>
</body>
</html>
